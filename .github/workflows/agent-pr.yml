name: Open agent changes for review

on:
  push:
    branches: ['codex/agent/**']

permissions:
  contents: read

concurrency:
  group: agent-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-agent-pr:
    if: github.actor == 'darrenhull' && github.repository_owner == 'darrenhull'
    permissions:
      contents: write
      pull-requests: write
    uses: darrenhull/Jade-VSCode-Extension/.github/workflows/open-agent-pr.yml@0798d998829a879bb980fb47e03ac2f40524fdf0
