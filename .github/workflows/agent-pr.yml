name: Open agent changes for review

on:
  push:
    branches: ['codex/agent/**']

permissions:
  contents: read

concurrency:
  group: agent-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-agent-pr:
    if: github.actor == 'darrenhull' && github.repository_owner == 'darrenhull'
    permissions:
      contents: write
      pull-requests: write
    uses: darrenhull/Jade-VSCode-Extension/.github/workflows/open-agent-pr.yml@cc1a7536076c7a870dcac523b96cd46e5a7a72fc
