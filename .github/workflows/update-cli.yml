name: Update pinned Jade CLI

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: CLI release tag (blank selects latest stable release)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mcp-cli-release-update
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/update-consumer.yml
    with:
      cli_tag: ${{ inputs.cli_tag || '' }}
      update_script: scripts/update-cli.js
