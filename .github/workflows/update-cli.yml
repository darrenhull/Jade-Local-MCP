name: Update pinned Jade CLI

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: CLI release tag (blank selects latest stable release)
        type: string
        required: false
  repository_dispatch:
    types: [jade-cli-released]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    uses: darrenhull/Jade-VSCode-Extension/.github/workflows/update-consumer.yml@0b5ad923a8e56ced5f0332345821683c0918310b
    with:
      consumer_automation_ref: 0b5ad923a8e56ced5f0332345821683c0918310b
      cli_tag: ${{ inputs.cli_tag || github.event.client_payload.cli_tag || '' }}
      update_script: scripts/update-cli.js
      package_script: package:standalone
      release_script: scripts/release-check.js
      release_args_json: '["--artifacts"]'
      ci_workflow: build.yml
      standalone_executable: dist/jade-mcp-win-x64/jade-mcp.exe
      standalone_archive: dist/jade-mcp-win-x64.zip
      standalone_env: JADE_MCP_STANDALONE_EXE
